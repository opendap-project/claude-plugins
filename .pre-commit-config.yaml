# Local checks for every commit. Install once per clone: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5120"]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/opendap-project/tools
    rev: v0.1.0
    hooks:
      - id: no-stray-files
  # The plugin's hook scripts, tested with the standard library.
  - repo: local
    hooks:
      - id: plugin-script-tests
        name: plugin script tests (unittest)
        entry: python3 -m unittest discover -s plugins/opendap/tests
        language: system
        pass_filenames: false
        files: ^plugins/opendap/(scripts|tests)/
